<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OSS Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#172033}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#loginPage{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#071a36,#102d59)}.loginBox{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.loginLogo{width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 15px}.loginBox h1{text-align:center;margin:5px 0;color:#0b2852}.loginBox p{text-align:center;color:#777;margin-bottom:25px}.formGroup{margin-bottom:15px}.formGroup label{display:block;font-weight:700;margin-bottom:6px}.formGroup input,.formGroup select{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:9px;outline:none;background:#fff}.formGroup input:focus,.formGroup select:focus{border-color:#0b4c9c}.primaryBtn{width:100%;border:0;padding:13px;border-radius:10px;background:#0b2852;color:#fff;font-weight:700}.primaryBtn:disabled,.saveBtn:disabled{opacity:.6;cursor:wait}.errorText{color:#c62828;font-size:14px;margin-top:12px;text-align:center;min-height:18px}
#adminPage{min-height:100vh}.topbar{background:#071a36;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:50}.topbarLeft{display:flex;align-items:center;gap:12px}.topbarLogo{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}.topbar h2{margin:0;font-size:20px}.topbar small{opacity:.75}.logoutBtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:9px 15px;border-radius:8px}.container{max-width:1400px;margin:auto;padding:20px}.actionRow{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}.addBtn{border:0;background:#0b2852;color:#fff;padding:12px 18px;border-radius:9px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.07)}.statTitle{color:#777;font-size:13px}.statValue{font-size:27px;font-weight:800;margin-top:5px}.toolbar{background:#fff;padding:15px;border-radius:12px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;box-shadow:0 3px 12px rgba(0,0,0,.07)}.toolbar input,.toolbar select{padding:11px;border:1px solid #ccd3df;border-radius:8px;outline:none}.toolbar input{flex:1;min-width:220px}.firebaseStatus{background:#fff;border-radius:10px;padding:12px 15px;margin-bottom:20px;box-shadow:0 3px 12px rgba(0,0,0,.06);font-weight:700}.statusOnline{color:#188038}.statusOffline{color:#c62828}
.productList{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}.productCard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08);border:1px solid #e6e9ef}.productImage{width:100%;height:220px;object-fit:contain;background:#f8f9fb;display:block}.productBody{padding:16px}.productCode{font-size:13px;font-weight:800;color:#0b4c9c;margin-bottom:5px}.productName{font-size:17px;font-weight:800;line-height:1.3;margin-bottom:7px}.productCategory{font-size:13px;color:#666;margin-bottom:9px}.productMOQ{font-size:13px;font-weight:700;margin-bottom:10px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}.badgeIn{background:#e7f6ec;color:#137333}.badgeComing{background:#fff3cd;color:#856404}.badgeOut{background:#fde8e8;color:#c62828}.cardButtons{display:flex;gap:8px}.editBtn,.deleteBtn{flex:1;border:0;padding:10px;border-radius:8px;font-weight:700}.editBtn{background:#0b2852;color:#fff}.deleteBtn{background:#fde8e8;color:#c62828}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;justify-content:center;align-items:center;padding:20px;z-index:100}.modal.show{display:flex}.modalBox{width:100%;max-width:650px;max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modalHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalHeader h2{margin:0}.closeBtn{border:0;background:#f0f2f5;width:38px;height:38px;border-radius:50%;font-size:20px}.modalGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.imagePreview{width:100%;height:220px;object-fit:contain;background:#f6f7f9;border-radius:10px;margin-top:10px;display:none}.modalActions{display:flex;gap:10px;margin-top:20px}.saveBtn,.cancelBtn{flex:1;border:0;padding:12px;border-radius:9px;font-weight:700}.saveBtn{background:#0b2852;color:#fff}.cancelBtn{background:#eceff3}.helpText{font-size:12px;color:#777;margin-top:5px}.loading,.empty{background:#fff;padding:40px;border-radius:12px;text-align:center;color:#777}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.container{padding:12px}.topbar{padding:10px 12px}.topbar h2{font-size:16px}.modalGrid{grid-template-columns:1fr}.full{grid-column:auto}.productList{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginPage"><div class="loginBox">
<img src="538820.jpg" class="loginLogo" alt="OSS"><h1>OSS ADMIN</h1><p>ONE STOP SOLUTION</p>
<div class="formGroup"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username" placeholder="Admin Email"></div>
<div class="formGroup"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" placeholder="Password"></div>
<button class="primaryBtn" id="loginButton" type="button" onclick="login()">LOGIN</button><div id="loginError" class="errorText"></div>
</div></div>

<div id="adminPage" class="hidden"><div class="topbar"><div class="topbarLeft"><img src="538820.jpg" class="topbarLogo" alt="OSS"><div><h2>ONE STOP SOLUTION</h2><small>Wholesale Catalogue Admin</small></div></div><button class="logoutBtn" type="button" onclick="logout()">Logout</button></div>
<div class="container"><div class="actionRow"><div><h2 style="margin:0">Product Management</h2><div style="color:#777;font-size:13px;margin-top:4px">All products are editable</div></div><button class="addBtn" type="button" onclick="openAdd()">+ ADD NEW PRODUCT</button></div>
<div class="stats"><div class="stat"><div class="statTitle">TOTAL PRODUCTS</div><div id="totalCount" class="statValue">0</div></div><div class="stat"><div class="statTitle">IN STOCK</div><div id="inStockCount" class="statValue">0</div></div><div class="stat"><div class="statTitle">COMING SOON</div><div id="comingCount" class="statValue">0</div></div><div class="stat"><div class="statTitle">OUT OF STOCK</div><div id="outStockCount" class="statValue">0</div></div><div class="stat"><div class="statTitle">CATEGORIES</div><div id="categoryCount" class="statValue">0</div></div></div>
<div id="firebaseStatus" class="firebaseStatus">Connecting to Firebase...</div>
<div class="toolbar"><input type="text" id="searchInput" placeholder="Search by code, product name or category..." oninput="renderProducts()"><select id="stockFilter" onchange="renderProducts()"><option value="ALL">All Status</option><option value="In Stock">In Stock</option><option value="Coming Soon">Coming Soon</option><option value="Out of Stock">Out of Stock</option></select></div>
<div id="productList" class="productList"><div class="loading">Loading products...</div></div></div></div>

<div id="productModal" class="modal"><div class="modalBox"><div class="modalHeader"><h2 id="modalTitle">Add New Product</h2><button class="closeBtn" type="button" onclick="closeModal()">×</button></div>
<div class="modalGrid"><div class="formGroup"><label for="pCode">Product Code</label><input id="pCode" type="text" placeholder="OSS_039"></div><div class="formGroup"><label for="pStatus">Stock Status</label><select id="pStatus"><option value="In Stock">In Stock</option><option value="Coming Soon">Coming Soon</option><option value="Out of Stock">Out of Stock</option></select></div><div class="formGroup full"><label for="pName">Product Name</label><input id="pName" type="text" placeholder="Product Name"></div><div class="formGroup full"><label for="pCategory">Category</label><input id="pCategory" type="text" placeholder="Category"></div><div class="formGroup full"><label for="pImage">Image</label><input id="pImage" type="text" placeholder="OSS_039.jpg" oninput="previewImage()"><div class="helpText">Example: OSS_039.jpg or complete image URL</div><img id="imagePreview" class="imagePreview" alt="Preview"></div><div class="formGroup full"><label for="pMOQ">MOQ</label><input id="pMOQ" type="text" value="₹500 Minimum Order Quantity (MOQ)"></div></div>
<div class="modalActions"><button class="cancelBtn" type="button" onclick="closeModal()">CANCEL</button><button class="saveBtn" type="button" onclick="saveProduct()">SAVE PRODUCT</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
"use strict";
const firebaseConfig={apiKey:"AIzaSyBY7FpGggnMnv-IsqG81rjY1ofCWRm48wk",authDomain:"oss-digital-catalog.firebaseapp.com",projectId:"oss-digital-catalog",storageBucket:"oss-digital-catalog.firebasestorage.app",messagingSenderId:"294933773409",appId:"1:294933773409:web:3a62fc14daaa9d344cfe20",measurementId:"G-GT8YNKQJ5K"};
const ADMIN_UID="NBaVvM86X9SqffFiWI7lA27Isnl1";
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let products=[],editingId=null,isAdding=false,unsubscribeProducts=null;
function err(m){document.getElementById("loginError").textContent=m||""}
function showAdmin(){document.getElementById("loginPage").classList.add("hidden");document.getElementById("adminPage").classList.remove("hidden")}
function showLogin(){document.getElementById("loginPage").classList.remove("hidden");document.getElementById("adminPage").classList.add("hidden")}
function friendly(e){const m={"auth/invalid-email":"Invalid email address.","auth/invalid-credential":"Incorrect email or password.","auth/wrong-password":"Incorrect email or password.","auth/user-not-found":"User not found.","auth/user-disabled":"This user account is disabled.","auth/too-many-requests":"Too many attempts. Please try again later.","auth/network-request-failed":"Network error. Check your internet connection."};return m[e&&e.code]||(e&&e.message)||"Login failed."}
async function login(){const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value,btn=document.getElementById("loginButton");err("");if(!email||!password){err("Please enter email and password.");return}btn.disabled=true;btn.textContent="LOGGING IN...";try{const c=await auth.signInWithEmailAndPassword(email,password);if(!c.user)throw new Error("Login did not return a user.");if(c.user.uid!==ADMIN_UID){await auth.signOut();throw new Error("This account is not authorized for OSS Admin.")}}catch(e){console.error(e);err(friendly(e))}finally{btn.disabled=false;btn.textContent="LOGIN"}}
async function logout(){try{await auth.signOut()}catch(e){console.error(e)}}
auth.onAuthStateChanged(user=>{if(user&&user.uid===ADMIN_UID){err("");showAdmin();startFirebase()}else{if(unsubscribeProducts){unsubscribeProducts();unsubscribeProducts=null}if(user&&user.uid!==ADMIN_UID){err("This account is not authorized for OSS Admin.");auth.signOut();return}showLogin()}});
function startFirebase(){const s=document.getElementById("firebaseStatus");s.textContent="Connecting to Firebase...";s.className="firebaseStatus";if(unsubscribeProducts)unsubscribeProducts();unsubscribeProducts=db.collection("products").onSnapshot(snap=>{products=[];snap.forEach(doc=>{const d=doc.data()||{};products.push({id:doc.id,code:d.code||doc.id,name:d.name||"",category:d.category||"",image:d.image||"",status:d.status||d.stock||"In Stock",moq:d.moq||"₹500 Minimum Order Quantity (MOQ)"})});products.sort((a,b)=>sortCode(a.code,b.code));s.textContent="● Firebase Connected — Live";s.className="firebaseStatus statusOnline";updateStats();renderProducts()},e=>{console.error(e);s.textContent="● Firebase Error: "+(e.message||"Unknown error");s.className="firebaseStatus statusOffline"})}
function sortCode(a,b){const aa=String(a||"").toUpperCase(),bb=String(b||"").toUpperCase(),na=parseInt(aa.replace(/\D/g,""),10),nb=parseInt(bb.replace(/\D/g,""),10);return !Number.isNaN(na)&&!Number.isNaN(nb)?na-nb:aa.localeCompare(bb)}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escjs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n")}
function status(v){v=String(v||"").trim().toLowerCase();return v==="coming soon"||v==="coming"?"Coming Soon":v==="out of stock"||v==="out"?"Out of Stock":"In Stock"}
function imagePath(p){return p.image||((p.code||"")+".jpg")||"538820.jpg"}
function updateStats(){document.getElementById("totalCount").textContent=products.length;document.getElementById("inStockCount").textContent=products.filter(p=>status(p.status)==="In Stock").length;document.getElementById("comingCount").textContent=products.filter(p=>status(p.status)==="Coming Soon").length;document.getElementById("outStockCount").textContent=products.filter(p=>status(p.status)==="Out of Stock").length;document.getElementById("categoryCount").textContent=new Set(products.map(p=>String(p.category||"").trim()).filter(Boolean)).size}
function renderProducts(){const list=document.getElementById("productList"),q=document.getElementById("searchInput").value.trim().toLowerCase(),f=document.getElementById("stockFilter").value;const arr=products.filter(p=>{const t=(p.code+" "+p.name+" "+p.category).toLowerCase();return(!q||t.includes(q))&&(f==="ALL"||status(p.status)===f)});if(!arr.length){list.innerHTML='<div class="empty">No products found.</div>';return}list.innerHTML=arr.map(p=>{const st=status(p.status),bc=st==="Coming Soon"?"badgeComing":st==="Out of Stock"?"badgeOut":"badgeIn",id=escjs(p.id);return `<div class="productCard"><img class="productImage" src="${esc(imagePath(p))}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='538820.jpg';"><div class="productBody"><div class="productCode">${esc(p.code)}</div><div class="productName">${esc(p.name)}</div><div class="productCategory">${esc(p.category)}</div><div class="productMOQ">${esc(p.moq)}</div><span class="badge ${bc}">${esc(st)}</span><div class="cardButtons"><button class="editBtn" type="button" onclick="openEdit('${id}')">EDIT</button><button class="deleteBtn" type="button" onclick="deleteProduct('${id}')">DELETE</button></div></div></div>`}).join("")}
function openAdd(){isAdding=true;editingId=null;document.getElementById("modalTitle").textContent="Add New Product";document.getElementById("pCode").value="";document.getElementById("pName").value="";document.getElementById("pCategory").value="";document.getElementById("pImage").value="";document.getElementById("pStatus").value="In Stock";document.getElementById("pMOQ").value="₹500 Minimum Order Quantity (MOQ)";document.getElementById("imagePreview").style.display="none";document.getElementById("productModal").classList.add("show")}
function openEdit(id){const p=products.find(x=>x.id===id);if(!p){alert("Product not found.");return}isAdding=false;editingId=id;document.getElementById("modalTitle").textContent="Edit Product";document.getElementById("pCode").value=p.code||"";document.getElementById("pName").value=p.name||"";document.getElementById("pCategory").value=p.category||"";document.getElementById("pImage").value=p.image||"";document.getElementById("pStatus").value=status(p.status);document.getElementById("pMOQ").value=p.moq||"₹500 Minimum Order Quantity (MOQ)";previewImage();document.getElementById("productModal").classList.add("show")}
function previewImage(){const v=document.getElementById("pImage").value.trim(),im=document.getElementById("imagePreview");if(!v){im.src="";im.style.display="none";return}im.onerror=()=>{im.onerror=null;im.src="538820.jpg"};im.src=v;im.style.display="block"}
function closeModal(){document.getElementById("productModal").classList.remove("show");editingId=null;isAdding=false}
async function saveProduct(){const code=document.getElementById("pCode").value.trim(),name=document.getElementById("pName").value.trim(),category=document.getElementById("pCategory").value.trim(),image=document.getElementById("pImage").value.trim(),st=status(document.getElementById("pStatus").value),moq=document.getElementById("pMOQ").value.trim()||"₹500 Minimum Order Quantity (MOQ)";if(!code)return alert("Please enter Product Code.");if(!name)return alert("Please enter Product Name.");if(!category)return alert("Please enter Category.");const dup=products.find(p=>String(p.code||"").toUpperCase()===code.toUpperCase()&&p.id!==editingId);if(dup)return alert("This Product Code already exists: "+dup.code);const data={code,name,category,image:image||(code+".jpg"),status:st,moq,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};const b=document.querySelector(".saveBtn"),old=b.textContent;b.disabled=true;b.textContent="SAVING...";try{if(isAdding){data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection("products").add(data)}else await db.collection("products").doc(editingId).update(data);closeModal()}catch(e){console.error(e);alert("Save failed:\n"+(e.message||"Unknown error"))}finally{b.disabled=false;b.textContent=old}}
async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p)return alert("Product not found.");if(!confirm("Delete this product?\n\n"+p.code+" - "+p.name))return;try{await db.collection("products").doc(id).delete()}catch(e){console.error(e);alert("Delete failed:\n"+(e.message||"Unknown error"))}}
document.getElementById("productModal").addEventListener("click",e=>{if(e.target.id==="productModal")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="Enter"&&document.activeElement===document.getElementById("loginPassword"))login()});
</script>
</body>
</html>
