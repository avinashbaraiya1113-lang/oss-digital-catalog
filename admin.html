/* =========================
   MESSAGE FUNCTION
========================= */

function showMessage(
  element,
  message,
  type="error"
){

  element.textContent = message;

  element.className =
    "message " + type;

  element.style.display = "block";
}


/* =========================
   CLEAR LOGIN MESSAGE
========================= */

function clearLoginMessage(){

  loginMessage.textContent = "";

  loginMessage.style.display = "none";

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async () => {

    clearLoginMessage();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if(!email || !password){

      showMessage(
        loginMessage,
        "Email અને Password બંને નાખો.",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";

    try{

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user =
        result.user;

      if(user.uid !== ADMIN_UID){

        await signOut(auth);

        showMessage(
          loginMessage,
          "આ account ને Admin access નથી.",
          "error"
        );

        return;
      }

      showMessage(
        loginMessage,
        "Login successful.",
        "success"
      );

    }

    catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );

      let msg =
        "Login failed. ફરી પ્રયાસ કરો.";

      if(
        error.code ===
        "auth/invalid-credential"
      ){

        msg =
          "Email અથવા Password ખોટો છે.";

      }

      else if(
        error.code ===
        "auth/user-not-found"
      ){

        msg =
          "આ Email માટે Admin account મળ્યું નથી.";

      }

      else if(
        error.code ===
        "auth/wrong-password"
      ){

        msg =
          "Password ખોટો છે.";

      }

      else if(
        error.code ===
        "auth/operation-not-allowed"
      ){

        msg =
          "Firebase માં Email/Password Login ચાલુ નથી.";

      }

      else if(
        error.code ===
        "auth/network-request-failed"
      ){

        msg =
          "Internet connection ની સમસ્યા છે.";

      }

      else{

        msg =
          "Error: " +
          (error.message || error.code);

      }

      showMessage(
        loginMessage,
        msg,
        "error"
      );

    }

    finally{

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";

    }

  }
);

/* =========================
   INITIALIZE MASTER PRODUCTS
========================= */

async function initializeMasterProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );

    const existing = {};

    snapshot.forEach(
      item => {

        existing[item.id] =
          item.data();

      }
    );


    for(
      const product
      of MASTER_PRODUCTS
    ){

      const old =
        existing[product.code] || {};

      await setDoc(
        doc(
          db,
          "products",
          product.code
        ),
        {

          code:
            product.code,

          name:
            product.name,

          category:
            product.category,

          image:
            product.image,

          moq:
            "₹500 Minimum Order Quantity (MOQ)",

          stock:
            old.stock ||
            "In Stock",

          status:
            old.stock ||
            "In Stock"

        },
        {
          merge:true
        }
      );

    }

  }

  catch(error){

    console.error(
      "INITIALIZE ERROR:",
      error
    );

    showMessage(
      adminMessage,
      "Products initialize કરતી વખતે error: " +
      error.message,
      "error"
    );

  }

}


/* =========================

========================= */

function fillProductSelect(){

  productSelect.innerHTML =
    `<option value="">Select Product</option>`;

  MASTER_PRODUCTS.forEach(
    product => {

      const option =
        document.createElement("option");

      option.value =
        product.code;

      option.textContent =
        product.code +
        " — " +
        product.name;

      productSelect.appendChild(
        option
      );

    }
  );

}


/* =========================
   SELECT PRODUCT
========================= */

productSelect.addEventListener(
  "change",
  async () => {

    const code =
      productSelect.value;

    if(!code){

      editCode.value = "";
      editName.value = "";
      editCategory.value = "";
      editImage.value = "";
      editStock.value = "In Stock";

      return;
    }

    const master =
      MASTER_PRODUCTS.find(
        p => p.code === code
      );

    if(!master) return;

    editCode.value =
      master.code;

    editName.value =
      master.name;

    editCategory.value =
      master.category;

    editImage.value =
      master.image;


    try{

      const snapshot =
        await getDocs(
          collection(db,"products")
        );

      let stock =
        "In Stock";

      snapshot.forEach(
        item => {

          if(item.id === code){

            const data =
              item.data();

            stock =
              data.stock ||
              data.status ||
              "In Stock";

          }

        }
      );

      editStock.value =
        stock;

    }

    catch(error){

      console.error(error);

    }

  }
);
