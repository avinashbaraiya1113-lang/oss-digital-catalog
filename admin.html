<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSS Admin Panel</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  color:#172033;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#071a36,#102d59);
}

.loginBox{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.loginLogo{
  width:90px;
  height:90px;
  object-fit:contain;
  display:block;
  margin:0 auto 15px;
}

.loginBox h1{
  text-align:center;
  margin:5px 0;
  color:#0b2852;
}

.loginBox p{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.formGroup{
  margin-bottom:15px;
}

.formGroup label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

.formGroup input,
.formGroup select{
  width:100%;
  padding:12px;
  border:1px solid #ccd3df;
  border-radius:9px;
  outline:none;
  background:#fff;
}

.formGroup input:focus,
.formGroup select:focus{
  border-color:#0b4c9c;
}

.primaryBtn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:10px;
  background:#0b2852;
  color:#fff;
  font-weight:700;
}

.primaryBtn:hover{
  background:#123b72;
}

.errorText{
  color:#c62828;
  font-size:14px;
  margin-top:12px;
  text-align:center;
}

/* TOPBAR */

#adminPage{
  min-height:100vh;
}

.topbar{
  background:#071a36;
  color:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbarLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

.topbarLogo{
  width:48px;
  height:48px;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
}

.topbar h2{
  margin:0;
  font-size:20px;
}

.topbar small{
  opacity:.75;
}

.logoutBtn{
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:#fff;
  padding:9px 15px;
  border-radius:8px;
}

/* CONTENT */

.container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.actionRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.addBtn{
  border:0;
  background:#0b2852;
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.statTitle{
  color:#777;
  font-size:13px;
}

.statValue{
  font-size:27px;
  font-weight:800;
  margin-top:5px;
}

/* TOOLBAR */

.toolbar{
  background:#fff;
  padding:15px;
  border-radius:12px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.toolbar input,
.toolbar select{
  padding:11px;
  border:1px solid #ccd3df;
  border-radius:8px;
  outline:none;
}

.toolbar input{
  flex:1;
  min-width:220px;
}

/* FIREBASE STATUS */

.firebaseStatus{
  background:#fff;
  border-radius:10px;
  padding:12px 15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  font-weight:700;
}

.statusOnline{
  color:#188038;
}

.statusOffline{
  color:#c62828;
}

/* PRODUCTS */

.productList{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;
}

.productCard{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  border:1px solid #e6e9ef;
}

.productImage{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#f8f9fb;
  display:block;
}

.productBody{
  padding:16px;
}

.productCode{
  font-size:13px;
  font-weight:800;
  color:#0b4c9c;
  margin-bottom:5px;
}

.productName{
  font-size:17px;
  font-weight:800;
  line-height:1.3;
  margin-bottom:7px;
}

.productCategory{
  font-size:13px;
  color:#666;
  margin-bottom:9px;
}

.productMOQ{
  font-size:13px;
  font-weight:700;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-bottom:12px;
}

.badgeIn{
  background:#e7f6ec;
  color:#137333;
}

.badgeComing{
  background:#fff3cd;
  color:#856404;
}

.badgeOut{
  background:#fde8e8;
  color:#c62828;
}

.cardButtons{
  display:flex;
  gap:8px;
}

.editBtn,
.deleteBtn{
  flex:1;
  border:0;
  padding:10px;
  border-radius:8px;
  font-weight:700;
}

.editBtn{
  background:#0b2852;
  color:#fff;
}

.deleteBtn{
  background:#fde8e8;
  color:#c62828;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:22px;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modalHeader h2{
  margin:0;
}

.closeBtn{
  border:0;
  background:#f0f2f5;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.modalGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.imagePreview{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#f6f7f9;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

.modalActions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.saveBtn,
.cancelBtn{
  flex:1;
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:700;
}

.saveBtn{
  background:#0b2852;
  color:#fff;
}

.cancelBtn{
  background:#eceff3;
}

.helpText{
  font-size:12px;
  color:#777;
  margin-top:5px;
}

.loading,
.empty{
  background:#fff;
  padding:40px;
  border-radius:12px;
  text-align:center;
  color:#777;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:550px){

  .container{
    padding:12px;
  }

  .topbar{
    padding:10px 12px;
  }

  .topbar h2{
    font-size:16px;
  }

  .modalGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .productList{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

  <div class="loginBox">

    <img
      src="538820.jpg"
      class="loginLogo"
      alt="OSS"
    >

    <h1>OSS ADMIN</h1>

    <p>ONE STOP SOLUTION</p>

    <div class="formGroup">

      <label>Email</label>

      <input
        type="email"
        id="loginEmail"
        autocomplete="username"
        placeholder="Admin Email"
      >

    </div>

    <div class="formGroup">

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        autocomplete="current-password"
        placeholder="Password"
      >

    </div>

    <button
      class="primaryBtn"
      onclick="login()"
    >
      LOGIN
    </button>

    <div
      id="loginError"
      class="errorText"
    ></div>

  </div>

</div>


<!-- ADMIN -->

<div
  id="adminPage"
  class="hidden"
>

  <div class="topbar">

    <div class="topbarLeft">

      <img
        src="538820.jpg"
        class="topbarLogo"
        alt="OSS"
      >

      <div>

        <h2>ONE STOP SOLUTION</h2>

        <small>Wholesale Catalogue Admin</small>

      </div>

    </div>

    <button
      class="logoutBtn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="container">

    <div class="actionRow">

      <div>

        <h2 style="margin:0">
          Product Management
        </h2>

        <div style="color:#777;font-size:13px;margin-top:4px">
          All products are editable
        </div>

      </div>

      <button
        class="addBtn"
        onclick="openAdd()"
      >
        + ADD NEW PRODUCT
      </button>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <div class="statTitle">TOTAL PRODUCTS</div>
        <div id="totalCount" class="statValue">0</div>
      </div>

      <div class="stat">
        <div class="statTitle">IN STOCK</div>
        <div id="inStockCount" class="statValue">0</div>
      </div>

      <div class="stat">
        <div class="statTitle">COMING SOON</div>
        <div id="comingCount" class="statValue">0</div>
      </div>

      <div class="stat">
        <div class="statTitle">OUT OF STOCK</div>
        <div id="outStockCount" class="statValue">0</div>
      </div>

      <div class="stat">
        <div class="statTitle">CATEGORIES</div>
        <div id="categoryCount" class="statValue">0</div>
      </div>

    </div>


    <!-- FIREBASE STATUS -->

    <div
      id="firebaseStatus"
      class="firebaseStatus"
    >
      Connecting to Firebase...

    <!-- SEARCH -->

    <div class="toolbar">

      <input
        type="text"
        id="searchInput"
        placeholder="Search by code, product name or category..."

      >

      <select
        id="stockFilter"

      >

        <option value="ALL">
          All Status
        </option>

        <option value="In Stock">
          In Stock
        </option>

        <option value="Coming Soon">
          Coming Soon
        </option>

        <option value="Out of Stock">
          Out of Stock
        </option>

      </select>

    </div>


    <!-- PRODUCTS -->

    <div
      id="productList"
      class="productList"
    >

      <div class="loading">
        Loading products...
      </div>

    </div>

  </div>

</div>


<!-- PRODUCT MODAL -->

<div
  id="productModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalHeader">

      <h2 id="modalTitle">
        Add New Product
      </h2>

      <button
        class="closeBtn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div class="modalGrid">

      <div class="formGroup">

        <label>Product Code</label>

        <input
          id="pCode"
          type="text"
          placeholder="OSS_039"
        >

      </div>


      <div class="formGroup">

        <label>Stock Status</label>

        <select id="pStatus">

          <option value="In Stock">
            In Stock
          </option>

          <option value="Coming Soon">
            Coming Soon
          </option>

          <option value="Out of Stock">
            Out of Stock

        </select>

      </div>


      <div class="formGroup full">

        <label>Product Name</label>

        <input
          id="pName"

      </div>


      <div class="formGroup full">

        <label>Category</label>

        <input
          id="pCategory"
          type="text"
          placeholder="Category"
        >

      </div>

        <label>Image</label>

        <input
          id="pImage"
          type="text"

          Example: OSS_039.jpg or image URL

      <div class="formGroup full">

        <label>MOQ</label>

          id="pMOQ"
          type="text"
          value="₹500 Minimum Order Quantity (MOQ)"

    <div class="modalActions">

      <button
        class="cancelBtn"
        onclick="closeModal()"

        CANCEL

    </div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBY7FpGggnMnv-IsqG81rjY1ofCWRm48wk",

  authDomain:
    "oss-digital-catalog.firebaseapp.com",

  projectId:
    "oss-digital-catalog",

  storageBucket:
    "oss-digital-catalog.firebasestorage.app",

  messagingSenderId:
    "294933773409",

  appId:
    "1:294933773409:web:3a62fc14daaa9d344cfe20",

  measurementId:
    "G-GT8YNKQJ5K"

};


firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();


/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
  "NBaVvM86X9SqffFiWI7lA27Isnl1";


/* =========================================
   GLOBAL
========================================= */

let products = [];

let editingId = null;

let isAdding = false;

let unsubscribeProducts = null;


/* =========================================
   AUTH STATE
========================================= */

auth.onAuthStateChanged(
  function(user){

    if(
      user &&
      user.uid === ADMIN_UID
    ){

      document
        .getElementById("loginPage")
        .classList.add("hidden");

      document
        .getElementById("adminPage")
        .classList.remove("hidden");

      startFirebase();

    }else{

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

      document
        .getElementById("adminPage")
        .classList.add("hidden");

      if(unsubscribeProducts){

        unsubscribeProducts();

        unsubscribeProducts = null;

      }

    }

  }
);


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const errorBox =
    document
      .getElementById("loginError");

  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "Please enter email and password.";

    return;

  }


  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

  }catch(error){

    console.error(error);

    errorBox.textContent =
      error.message ||
      "Login failed.";

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  try{

    await auth.signOut();

  }catch(error){

    console.error(error);

  }

}


/* =========================================
   FIREBASE LISTENER
========================================= */

function startFirebase(){

  const status =
    document.getElementById("firebaseStatus");

  status.textContent =
    "Connecting to Firebase...";

  status.className =
    "firebaseStatus";


  if(unsubscribeProducts){

    unsubscribeProducts();

  }


  unsubscribeProducts =
    db
      .collection("products")
      .onSnapshot(

        function(snapshot){

          products = [];


          snapshot.forEach(
            function(doc){

              const data =
                doc.data() || {};


              products.push({

                id:doc.id,

                code:
                  data.code ||
                  doc.id,

                name:
                  data.name ||
                  "",

                category:
                  data.category ||
                  "",

                image:
                  data.image ||
                  "",

                status:
                  data.status ||
                  data.stock ||
                  "In Stock",

                moq:
                  data.moq ||
                  "₹500 Minimum Order Quantity (MOQ)"

              });

            }
          );


          products.sort(
            function(a,b){

              return naturalCodeSort(
                a.code,
                b.code
              );

            }
          );


          status.textContent =
            "● Firebase Connected — Live";

          status.className =
            "firebaseStatus statusOnline";


          updateStats();

          renderProducts();

        },


        function(error){

          console.error(error);

          status.textContent =
            "● Firebase Error: " +
            error.message;

          status.className =
            "firebaseStatus statusOffline";

        }

      );

}


/* =========================================
   SORT
========================================= */

function naturalCodeSort(a,b){

  const aa =
    String(a || "").toUpperCase();

  const bb =
    String(b || "").toUpperCase();

  const na =
    parseInt(
      aa.replace(/\D/g,""),
      10
    );

  const nb =
    parseInt(
      bb.replace(/\D/g,""),
      10
    );


  if(
    !Number.isNaN(na) &&
    !Number.isNaN(nb)
  ){

    return na - nb;

  }


  return aa.localeCompare(bb);

}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =========================================
   IMAGE
========================================= */

function getImagePath(product){

  if(product.image){

    return product.image;

  }

  if(product.code){

    return product.code + ".jpg";

  }

  return "538820.jpg";

}


/* =========================================
   STATUS
========================================= */

function normalizeStatus(status){

  const value =
    String(status || "")
      .trim()
      .toLowerCase();


  if(
    value === "coming soon" ||
    value === "coming"
  ){

    return "Coming Soon";

  }


  if(
    value === "out of stock" ||
    value === "out"
  ){

    return "Out of Stock";

  }


  return "In Stock";

}


/* =========================================
   STATS
========================================= */

function updateStats(){

  const total =
    products.length;


  const inStock =
    products.filter(
      function(p){

        return normalizeStatus(p.status)
          === "In Stock";

      }
    ).length;


  const coming =
    products.filter(
      function(p){

        return normalizeStatus(p.status)
          === "Coming Soon";

      }
    ).length;


  const out =
    products.filter(
      function(p){

        return normalizeStatus(p.status)
          === "Out of Stock";

      }
    ).length;


  const categories =
    new Set(
      products
        .map(
          function(p){
            return String(p.category || "").trim();
          }
        )
        .filter(Boolean)
    ).size;


  document.getElementById("totalCount")
    .textContent = total;

  document.getElementById("inStockCount")
    .textContent = inStock;

  document.getElementById("comingCount")
    .textContent = coming;

  document.getElementById("outStockCount")
    .textContent = out;

  document.getElementById("categoryCount")
    .textContent = categories;

}


/* =========================================
   RENDER
========================================= */

function renderProducts(){

  const list =
    document.getElementById("productLi
