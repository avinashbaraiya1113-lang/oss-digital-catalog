<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    ONE STOP SOLUTION (OSS) — Wholesale Catalogue
  </title>

  <link
    rel="icon"
    href="538820.jpg"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="page">


    <!-- =========================
         HEADER
    ========================= -->

    <header>

      <div class="brand">

        <img
          src="538820.jpg"
          alt="OSS"
        >

        <div>

          <h1>
            ONE STOP SOLUTION
            <span>(OSS)</span>
          </h1>

          <p>
            EVERY PROBLEM
            <b>ONE SOLUTION</b>
          </p>

        </div>

      </div>


      <div class="hero">

        <div class="hero-red">
          WHOLESALE CATALOGUE
        </div>

        <p>
          Wide Range • Quality • Fast Delivery • Support
        </p>

      </div>


      <div class="tools">

        <input
          id="search"
          type="search"
          placeholder="Search product name or code…"
          autocomplete="off"
          aria-label="Search products"
        >


        <div
          id="cats"
          class="cats"
        ></div>


        <div class="filters">

          <button
            type="button"
            data-filter="All"
            class="active"
          >
            All Stock
          </button>

          <button
            type="button"
            data-filter="In Stock"
          >
            In Stock
          </button>

          <button
            type="button"
            data-filter="Coming Soon"
          >
            Coming Soon
          </button>

          <button
            type="button"
            data-filter="Out of Stock"
          >
            Out of Stock
          </button>

        </div>

      </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main>

      <div
        class="count"
        id="count"
      ></div>


      <section
        id="grid"
        class="grid"
        aria-live="polite"
      ></section>

    </main>


    <!-- =========================
         MULTIPLE ENQUIRY BAR
    ========================= -->

    <div
      id="bar"
      class="enquiry-bar hidden"
    >

      <div>

        <b id="selectedCount">
          0
        </b>

        products selected

      </div>


      <button
        type="button"
        id="multi"
      >
        Send Enquiry on WhatsApp
      </button>

    </div>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

      <img
        src="538820.jpg"
        alt="ONE STOP SOLUTION logo"
      >


      <div>

        <b>
          ONE STOP SOLUTION (OSS)
        </b>

        <br>

        Every Problem One Solution

        <br>

        WhatsApp: 9499806747

        <br>

        Instagram: @onestopsolution4325

      </div>

    </footer>


  </div>


  <!-- =========================
       JAVASCRIPT
       Firebase imports require
       type="module"
  ========================= -->

  <script
    type="module"
    src="app.js"
  ></script>


</body>

</html>
