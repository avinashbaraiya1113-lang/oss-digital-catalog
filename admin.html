<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSS Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

header{
  background:#101c3a;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
}

header img{
  width:55px;
  height:55px;
  object-fit:contain;
  border-radius:50%;
  background:white;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:4px 0 0;
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.login{
  max-width:420px;
  margin:60px auto;
}

h2{
  color:#101c3a;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,
select,
button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccd3dd;
  font-size:15px;
}

input,
select{
  margin-bottom:14px;
}

input[readonly]{
  background:#eef1f5;
  color:#667085;
}

button{
  border:0;
  background:#101c3a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  word-break:break-word;
}

.error{
  background:#ffebee;
  color:#b71c1c;
}

.success{
  background:#e8f5e9;
  color:#1b5e20;
}

.logout{
  width:auto;
  background:#c62828;
  padding:10px 18px;
}

.addBtn{
  background:#188038;
  margin-top:5px;
}

.deleteBtn{
  background:#c62828;
  margin-top:8px;
}

.secondary{
  background:#5f6368;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.product-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
  background:white;
}

.product img{
  width:100%;
  height:210px;
  object-fit:contain;
  background:#f7f7f7;
}

.product-body{
  padding:14px;
}

.code{
  font-size:13px;
  color:#687385;
  font-weight:bold;
}

.name{
  font-size:16px;
  font-weight:bold;
  margin:6px 0;
}

.category{
  font-size:13px;
  color:#566171;
  margin-bottom:8px;
}

.in{
  color:#188038;
  font-weight:bold;
}

.coming{
  color:#f29900;
  font-weight:bold;
}

.out{
  color:#d93025;
  font-weight:bold;
}

.edit{
  margin-top:10px;
}

.hidden{
  display:none!important;
}

.small-note{
  font-size:12px;
  color:#687385;
  margin-top:-8px;
  margin-bottom:12px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  background:#eef1f5;
  font-size:11px;
  font-weight:bold;
  margin-bottom:8px;
}

.new-badge{
  background:#e8f5e9;
  color:#188038;
}

.master-badge{
  background:#e8eefc;
  color:#101c3a;
}

.preview{
  width:100%;
  max-height:180px;
  object-fit:contain;
  background:#f7f7f7;
  border-radius:8px;
  margin-bottom:12px;
  display:none;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:17px;
  }

  .card{
    padding:15px;
  }

}
</style>
</head>

<div class="card">

નવી Product ઉમેરવા માટે નીચેની વિગતો ભરો.
</p>

<label>Product Code</label>

<input
  id="newCode"
  placeholder="Example: OSS_038"
>


<label>Product Name</label>

<input
  id="newName"
  placeholder="Enter product name"
>


<label>Category</label>

<input
  id="newCategory"
  placeholder="Enter category"
>


<label>Image Filename / URL</label>

<input
  id="newImage"
  placeholder="Example: OSS_038.jpg"
>


<label>Stock Status</label>

<select id="newStock">

<option value="In Stock">
In Stock
</option>

<option value="Coming Soon">
Coming Soon
</option>

<option value="Out of Stock">
Out of Stock
</option>

</select>


<label>Minimum Order Quantity</label>

<input
  id="newMOQ"
  value="₹500 Minimum Order Quantity (MOQ)"
>


<button
  id="addBtn"
  class="addBtn"
>
Add New Product
</button>

<div id="addMessage" class="message"></div>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>
All Products
<span id="productCount"></span>
</h2>

<div
  id="loading"
  style="padding:15px"
>
Loading...
</div>

<div
  id="products"
  class="product-list"
></div>

</div>

</section>

const loginSection =
document.getElementById("loginSection");

const adminSection =
document.getElementById("adminSection");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const productSelect =
document.getElementById("productSelect");

const productType =
document.getElementById("productType");

const editCode =
document.getElementById("editCode");

const editName =
document.getElementById("editName");

const editCategory =
document.getElementById("editCategory");

const editImage =
document.getElementById("editImage");

const editPreview =
document.getElementById("editPreview");

const editStock =
document.getElementById("editStock");

const editMOQ =
document.getElementById("editMOQ");

const saveBtn =
document.getElementById("saveBtn");

const saveMessage =
document.getElementById("saveMessage");

const deleteBtn =
document.getElementById("deleteBtn");

const productsDiv =
document.getElementById("products");

const loading =
document.getElementById("loading");

const productCount =
document.getElementById("productCount");


/* ADD NEW */

const newCode =
document.getElementById("newCode");

const newName =
document.getElementById("newName");

const newCategory =
document.getElementById("newCategory");

const newImage =
document.getElementById("newImage");

const newStock =
document.getElementById("newStock");

const newMOQ =
document.getElementById("newMOQ");

const addBtn =
document.getElementById("addBtn");

const addMessage =
document.getElementById("addMessage");


let firestoreProducts = [];


function message(
element,
text,
type="error"
){

element.textContent =
text;

element.className =
"message " + type;

element.style.display =
"block";

}


/* LOGIN */

loginBtn.addEventListener(
"click",
async()=>{

const mail =
email.value.trim();

const pass =
password.value;

if(!mail || !pass){

message(
loginMessage,
"Email અને Password બંને નાખો."
);

return;

}

loginBtn.disabled =
true;

loginBtn.textContent =
"Logging in...";

try{

const result =
await signInWithEmailAndPassword(
auth,
mail,
pass
);

if(
result.user.uid !== ADMIN_UID
){

await signOut(auth);

message(
loginMessage,
"આ account ને Admin access નથી."
);

return;

}

message(
loginMessage,
"Login successful.",
"success"
);

}
catch(error){

console.error(error);

let text =
"Login Error: " +
(error.message || error.code);

if(
error.code ===
"auth/invalid-credential"
){

text =
"Email અથવા Password ખોટો છે.";

}

message(
loginMessage,
text
);

}

finally{

loginBtn.disabled =
false;

loginBtn.textContent =
"Login";

}

});


/* LOGOUT */

logoutBtn.addEventListener(
"click",
()=>signOut(auth)
);


/* PRODUCT OPTIONS */

function createProductOptions(){

productSelect.innerHTML =
`<option value="">Select Product</option>`;

PRODUCTS.forEach(
p=>{

const option =
document.createElement("option");

option.value =
p[0];

option.textContent =
p[0] +
" — " +
p[2];

productSelect.appendChild(
option
);

});


/* NEW PRODUCTS */

firestoreProducts.forEach(
p=>{

const isMaster =
PRODUCTS.some(
m=>m[0]===p.code
);

if(isMaster) return;

const option =
document.createElement("option");

option.value =
p.code;

option.textContent =
p.code +
" — " +
(p.name || "New Product");

productSelect.appendChild(
option
);

});

}


/* CLEAR FORM */

function clearEdit(){

editCode.value="";
editName.value="";
editCategory.value="";
editImage.value="";
editMOQ.value =
"₹500 Minimum Order Quantity (MOQ)";

editStock.value =
"In Stock";

editPreview.style.display =
"none";

deleteBtn.classList.add(
"hidden"
);

productType.textContent =
"MASTER PRODUCT";

productType.className =
"badge master-badge";

}


/* SELECT PRODUCT */

productSelect.addEventListener(
"change",
()=>{

const code =
productSelect.value;

if(!code){

clearEdit();

return;

}


/* MASTER */

const master =
PRODUCTS.find(
p=>p[0]===code
);

if(master){

editCode.value =
master[0];

editName.value =
master[2];

editCategory.value =
master[1];

editImage.value =
master[3];

editPreview.src =
master[3];

editPreview.style.display =
"block";

productType.textContent =
"MASTER PRODUCT — LOCKED";

productType.className =
"badge master-badge";

deleteBtn.classList.add(
"hidden"
);


/* FIRESTORE DATA */

const data =
firestoreProducts.find(
p=>p.code===code
);

editStock.value =
data?.stock ||
"In Stock";

editMOQ.value =
data?.moq ||
"₹500 Minimum Order Quantity (MOQ)";

return;

}


/* NEW PRODUCT */

const newProduct =
firestoreProducts.find(
p=>p.code===code
);

if(!newProduct){

clearEdit();

return;

}

editCode.value =
newProduct.code || "";

editName.value =
newProduct.name || "";

editCategory.value =
newProduct.category || "";

editImage.value =
newProduct.image || "";

editStock.value =
newProduct.stock ||
"In Stock";

editMOQ.value =
newProduct.moq ||
"₹500 Minimum Order Quantity (MOQ)";

if(newProduct.image){

editPreview.src =
newProduct.image;

editPreview.style.display =
"block";

}else{

editPreview.style.display =
"none";

}

productType.textContent =
"NEW PRODUCT — EDITABLE";

productType.className =
"badge new-badge";

deleteBtn.classList.remove(
"hidden"
);

});


/* SAVE */

saveBtn.addEventListener(
"click",
async()=>{

const code =
editCode.value.trim();

if(!code){

message(
saveMessage,
"પહેલા Product પસંદ કરો."
);

return;

}


/* MASTER */

const master =
PRODUCTS.find(
p=>p[0]===code
);

saveBtn.disabled =
true;

saveBtn.textContent =
"Saving...";

try{

if(master){

await setDoc(

doc(
db,
"products",
code
),

{

code:master[0],

category:master[1],

name:master[2],

image:master[3],

moq:
editMOQ.value.trim() ||
"₹500 Minimum Order Quantity (MOQ)",

stock:
editStock.value,

status:
editStock.value,

isMaster:true

},

{
merge:true
}

);

message(
saveMessage,
"Master Product stock/MOQ updated successfully.",
"success"
);

}


/* NEW PRODUCT */

else{

await setDoc(

doc(
db,
"products",
code
),

{

code:code,

name:
editName.value.trim(),

category:
editCategory.value.trim(),

image:
editImage.value.trim(),

moq:
editMOQ.value.trim() ||
"₹500 Minimum Order Quantity (MOQ)",

stock:
editStock.value,

status:
editStock.value,

isMaster:false

},

{
merge:true
}

);

message(
saveMessage,
"Product updated successfully.",
"success"
);

}

}
catch(error){

console.error(error);

message(
saveMessage,
"Save Error: " +
error.message
);

}

finally{

saveBtn.disabled =
false;

saveBtn.textContent =
"Save Changes";

}

});


/* ADD NEW PRODUCT */

addBtn.addEventListener(
"click",
async()=>{

const code =
newCode.value.trim();

const name =
newName.value.trim();

const category =
newCategory.value.trim();

const image =
newImage.value.trim();

const stock =
newStock.value;

const moq =
newMOQ.value.trim() ||
"₹500 Minimum Order Quantity (MOQ)";


if(
!code ||
!name ||
!category
){

message(
addMessage,
"Code, Name અને Category ભરવું જરૂરી છે."
);

return;

}


/* MASTER CODE PROTECTION */

const master =
PRODUCTS.find(
p=>p[0]===code
);

if(master){

message(
addMessage,
"આ Code Master Product માટે પહેલેથી ઉપયોગમાં છે."
);

return;

}


/* DUPLICATE */

const exists =
firestoreProducts.some(
p=>p.code===code
);

if(exists){

message(
addMessage,
"આ Product Code પહેલેથી હાજર છે."
);

return;

}

addBtn.disabled =
true;

addBtn.textContent =
"Adding...";

try{

await setDoc(

doc(
db,
"products",
code
),

{

code:code,

name:name,

category:category,

image:image,

stock:stock,

status:stock,

moq:moq,

isMaster:false

}

);

message(
addMessage,
"New Product added successfully.",
"success"
);


/* CLEAR */

newCode.value="";
newName.value="";
newCategory.value="";
newImage.value="";

newStock.value =
"In Stock";

newMOQ.value =
"₹500 Minimum Order Quantity (MOQ)";

}
catch(error){

console.error(error);

message(
addMessage,
"Add Error: " +
error.message
);

}

finally{

addBtn.disabled =
false;

addBtn.textContent =
"Add New Product";

}

});


/* DELETE NEW PRODUCT */

deleteBtn.addEventListener(
"click",
async()=>{

const code =
editCode.value.trim();

if(!code) return;


/* NEVER DELETE MASTER */

const master =
PRODUCTS.find(
p=>p[0]===code
);

if(master){

message(
saveMessage,
"Master Product delete કરી શકાતું નથી."
);

return;

}

const ok =
confirm(
"શું તમે આ New Product delete કરવા માંગો છો?"
);

if(!ok) return;

deleteBtn.disabled =
true;

deleteBtn.textContent =
"Deleting...";

try{

await deleteDoc(
doc(
db,
"products",
code
)
);

message(
saveMessage,
"New Product deleted successfully.",
"success"
);

productSelect.value =
"";

clearEdit();

}
catch(error){

console.error(error);

message(
saveMessage,
"Delete Error: " +
error.message
);
