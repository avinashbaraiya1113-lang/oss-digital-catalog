/* =========================
   INITIALIZE MASTER PRODUCTS
========================= */

async function initializeMasterProducts(){

  try{

    const snapshot =
    await getDocs(
      collection(db,"products")
    );


    const existing = {};

    snapshot.forEach(item=>{

      existing[item.id] =
      item.data();

    });


    for(
      const p of MASTER_PRODUCTS
    ){

      const old =
      existing[p.code] || {};


      const data = {

        code:p.code,

        name:p.name,

        category:p.category,

        image:p.image,

        moq:"₹500 Minimum Order Quantity (MOQ)"

      };


      /*
        Preserve existing stock.
        If no stock exists, use In Stock.
      */

      if(old.stock){

        data.stock =
        old.stock;

      }

      else{

        data.stock =
        "In Stock";

      }


      /*
        Keep status synchronized
        for future catalogue connection.
      */

      data.status =
      data.stock;


      await setDoc(
        doc(
          db,
          "products",
          p.code
        ),
        data,
        {merge:true}
      );

    }


  }

  catch(error){

    showMessage(
      "Could not initialize master products. Please check Firestore rules.",
      "error"
    );

  }

}


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts(){

  if(unsubscribeProducts){

    unsubscribeProducts();

  }


  const ref =
  collection(db,"products");


  unsubscribeProducts =
  onSnapshot(
    ref,

    snapshot=>{

      products = [];


      snapshot.forEach(item=>{

        products.push({

          id:item.id,

          ...item.data()

        });

      });


      /*
        Sort by OSS number.
      */

      products.sort(
        (a,b)=>
        String(
          a.code || a.id
        ).localeCompare(
          String(
            b.code || b.id
          ),
          undefined,
          {numeric:true}
        )
      );


      renderProducts();

    },

    error=>{

      showMessage(
        "Could not load products.",
        "error"
      );

    }

  );

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  const search =
  adminSearch.value
  .trim()
  .toLowerCase();


  const filtered =
  products.filter(p=>{

    const text =

      `${p.code || ""} ` +

      `${p.name || ""} ` +

      `${p.category || ""} ` +

      `${p.stock || ""}`

      .toLowerCase();


    return text.includes(search);

  });


  adminCount.textContent =
  `${filtered.length} products`;


  if(filtered.length === 0){

    productsList.innerHTML =
    "<p>No products found.</p>";

    return;

  }


  productsList.innerHTML =
  filtered.map(p=>{

    const currentStock =
    p.stock ||
    p.status ||
    "In Stock";


    let badgeClass =
    "status-badge";


    if(
      currentStock ===
      "Coming Soon"
    ){

      badgeClass +=
      " status-coming";

    }


    if(
      currentStock ===
      "Out of Stock"
    ){

      badgeClass +=
      " status-out";

    }


    return `

    <div class="product">

      <img
        src="${escapeAttr(
          p.image ||
          `${p.code}.jpg`
        )}"
        onerror="this.src='538820.jpg'"
        alt="Product">


      <div class="product-info">

        <h3>
          ${escapeHtml(
            p.name ||
            "Unnamed Product"
          )}
        </h3>


        <p>
          <b>Code:</b>
          ${escapeHtml(
            p.code ||
            p.id
          )}
        </p>


        <p>
          <b>Category:</b>
          ${escapeHtml(
            p.category ||
            "-"
          )}
        </p>


        <p>
          <b>Stock:</b>
          <span class="${badgeClass}">
            ${escapeHtml(
              currentStock
            )}
          </span>
        </p>


        <p class="moq">
          ₹500 Minimum Order Quantity (MOQ)
        </p>

      </div>


      <div class="actions">

        <button
          class="primary"
          data-edit="${escapeAttr(p.id)}">

          Edit

        </button>


        <button
          class="danger"
          data-delete="${escapeAttr(p.id)}">

          Delete

        </button>

      </div>

    </div>

    `;

  }).join("");


  /*
    Attach Edit buttons
  */

  productsList
  .querySelectorAll(
    "[data-edit]"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        editProduct(
          button.dataset.edit
        );

      }
    );

  });


  /*
    Attach Delete buttons
  */

  productsList
  .querySelectorAll(
    "[data-delete]"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        removeProduct(
          button.dataset.delete
        );

      }
    );

  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHtml(value);

}
