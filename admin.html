<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSS Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  color:#172033;
}

header{
  background:#071b3a;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo-title{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-title img{
  width:52px;
  height:52px;
  object-fit:contain;
  border-radius:50%;
  background:white;
}

.logo-title h1{
  font-size:21px;
}

.logo-title p{
  font-size:12px;
  color:#e8bd42;
  margin-top:4px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:8px;
  font-weight:bold;
}

.logout{
  background:#c62828;
  color:white;
  padding:10px 15px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.login-box{
  max-width:430px;
  margin:70px auto;
}

.login-box h2{
  text-align:center;
  color:#071b3a;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d5d9df;
  border-radius:8px;
  margin-top:7px;
  margin-bottom:15px;
  font-size:15px;
  background:white;
}

label{
  font-size:13px;
  font-weight:bold;
  color:#4a5568;
}

.primary{
  width:100%;
  background:#071b3a;
  color:white;
  padding:13px;
  font-size:15px;
}

.gold{
  background:#d7a928;
  color:#071b3a;
  padding:12px 18px;
}

.red{
  background:#c62828;
  color:white;
  padding:10px 15px;
}

.green{
  color:#16803a;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-size:14px;
  margin-top:10px;
}

.success{
  color:#16803a;
  font-weight:bold;
  margin-top:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#071b3a;
  color:white;
  padding:18px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:26px;
  color:#e8bd42;
  margin-top:6px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.toolbar input{
  flex:1;
  min-width:200px;
}

.product-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.product{
  border:1px solid #e1e5eb;
  border-radius:12px;
  padding:15px;
  background:#fff;
}

.product-top{
  display:flex;
  gap:14px;
}

.product-img{
  width:90px;
  height:90px;
  border-radius:10px;
  object-fit:cover;
  border:1px solid #ddd;
  background:#f5f5f5;
}

.product-info{
  flex:1;
}

.product-info h3{
  font-size:16px;
  color:#071b3a;
  margin-bottom:5px;
}

.product-info p{
  font-size:13px;
  margin:4px 0;
  color:#555;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  margin-top:5px;
}

.in{
  background:#d9f7df;
  color:#14752d;
}

.coming{
  background:#fff1c9;
  color:#956d00;
}

.out{
  background:#ffdcdc;
  color:#a40000;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions button{
  flex:1;
  padding:10px;
}

.edit{
  background:#071b3a;
  color:white;
}

.delete{
  background:#c62828;
  color:white;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:99;
  overflow:auto;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:650px;
  margin:20px auto;
  padding:22px;
  border-radius:15px;
}

.modal-box h2{
  color:#071b3a;
  margin-bottom:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
  padding:13px;
}

.preview{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
  display:none;
  margin-bottom:15px;
}

.hidden{
  display:none !important;
}

@media(max-width:750px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .product-list{
    grid-template-columns:1fr;
  }

  header{
    align-items:flex-start;
  }

  .logo-title h1{
    font-size:17px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="card login-box">
    <h2>OSS ADMIN PANEL</h2>

    <label>Email</label>
    <input id="email" type="email"
      value="onestopsolution4325@gmail.com"
      placeholder="Admin Email">

    <label>Password</label>
    <input id="password" type="password"
      placeholder="Enter Password">

    <button class="primary" onclick="login()">
      LOGIN
    </button>

    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">

<header>
  <div class="logo-title">
    <img src="538820.jpg" onerror="this.style.display='none'">
    <div>
      <h1>OSS Product Management</h1>
      <p>ONE STOP SOLUTION — EVERY PROBLEM ONE SOLUTION</p>
    </div>
  </div>

  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- STATS -->
  <div class="card">
    <div class="stats">

      <div class="stat">
        Total Products
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        In Stock
        <strong id="inStockCount">0</strong>
      </div>

      <div class="stat">
        Coming Soon
        <strong id="comingCount">0</strong>
      </div>

      <div class="stat">
        Out of Stock
        <strong id="outCount">0</strong>
      </div>

    </div>
  </div>

  <!-- ADD -->
  <div class="card">
    <button class="gold" onclick="openAdd()">
      ＋ ADD NEW PRODUCT
    </button>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <div class="toolbar">
      <input
        id="search"
        placeholder="Search product code, name or category..."
        oninput="renderProducts()">

      <select id="filterStock" onchange="renderProducts()">
        <option value="ALL">All Stock</option>
        <option value="In Stock">In Stock</option>
        <option value="Coming Soon">Coming Soon</option>
        <option value="Out of Stock">Out of Stock</option>
      </select>
    </div>
  </div>

  <!-- LIVE STATUS -->
  <div class="card">
    <b>Firebase Connection:</b>
    <span id="firebaseStatus" class="green">
      Connecting...
    </span>
  </div>

  <!-- PRODUCTS -->
  <div class="card">
    <h2 style="margin-bottom:15px;color:#071b3a;">
      All Products
    </h2>

    <div id="productList" class="product-list"></div>
  </div>

</div>
</div>

<!-- EDIT MODAL -->
<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">Edit Product</h2>

    <label>Product Code</label>
    <input id="pCode" placeholder="OSS_001">

    <label>Product Name</label>
    <input id="pName" placeholder="Product Name">

    <label>Category</label>
    <input id="pCategory" placeholder="Category">

    <label>Image Filename / URL</label>
    <input id="pImage"
      placeholder="OSS_001.jpg or image URL"
      oninput="previewImage()">

    <img id="imagePreview" class="preview">

    <label>Stock Status</label>
    <select id="pStock">
      <option value="In Stock">In Stock</option>
      <option value="Coming Soon">Coming Soon</option>
      <option value="Out of Stock">Out of Stock</option>
    </select>

    <label>MOQ</label>
    <input id="pMOQ"
      value="₹500 Minimum Order Quantity (MOQ)">

    <div id="saveMessage"></div>

    <div class="modal-actions">

      <button class="primary" onclick="saveProduct()">
        SAVE PRODUCT
      </button>

      <button class="red" onclick="closeModal()">
        CANCEL
      </button>

    </div>

  </div>

</div>

<script>

/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBY7FpGggnMnv-IsqG81rjY1ofCWRm48wk",
  authDomain: "oss-digital-catalog.firebaseapp.com",
  projectId: "oss-digital-catalog",
  storageBucket: "oss-digital-catalog.firebasestorage.app",
  messagingSenderId: "294933773409",
  appId: "1:294933773409:web:3a62fc14daaa9d344cfe20",
  measurementId: "G-GT8YNKQJ5K"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_UID =
"NBaVvM86X9SqffFiWI7lA27Isnl1";

let products = [];
let editingId = null;
let isAdding = false;


/* ================================
   AUTH
================================ */

auth.onAuthStateChanged(function(user){

  if(user){

    if(user.uid !== ADMIN_UID){

      document.getElementById("loginError").textContent =
      "This account is not authorized.";

      auth.signOut();
      return;
    }

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

    startFirebase();

  }else{

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("adminPage")
      .classList.add("hidden");
  }

});


function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  document.getElementById("loginError").textContent =
    "Logging in...";

  auth.signInWithEmailAndPassword(email,password)
  .catch(function(error){

    document.getElementById("loginError").textContent =
      error.message;

  });

}


function logout(){
  auth.signOut();
}


/* ================================
   FIREBASE LIVE DATA
================================ */

function startFirebase(){

  document.getElementById("firebaseStatus").textContent =
    "Connected — Live";

  db.collection("products")
    .onSnapshot(function(snapshot){

      products = [];

      snapshot.forEach(function(doc){

        products.push({
          id:doc.id,
          ...doc.data()
        });

      });

      products.sort(function(a,b){

        return compareCodes(
          a.code || a.id,
          b.code || b.id
        );

      });

      renderProducts();
      updateStats();

      document.getElementById("firebaseStatus").textContent =
        "Connected — Live";

    },function(error){

      document.getElementById("firebaseStatus").textContent =
        "Connection Error";

      console.error(error);

    });

}


/* ================================
   SORT
================================ */

function compareCodes(a,b){

  const na =
    parseInt(String(a).replace(/\D/g,"")) || 999999;

  const nb =
    parseInt(String(b).replace(/\D/g,"")) || 999999;

  return na - nb;
}


/* ================================
   RENDER
================================ */

function renderProducts(){

  const list =
    document.getElementById("productList");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filter =
    document.getElementById("filterStock").value;

  list.innerHTML = "";

  let filtered =
    products.filter(function(p){

      const text =
        (
          (p.code || "") + " " +
          (p.name || "") + " " +
          (p.category || "")
        ).toLowerCase();

      const matchSearch =
        !search || text.includes(search);

      const matchStock =
        filter === "ALL" ||
        (p.stock || p.status || "In Stock") === filter;

      return matchSearch && matchStock;

    });


  if(filtered.length === 0){

    list.innerHTML =
      "<p>No products found.</p>";

    return;
  }


  filtered.forEach(function(p){

    const stock =
      p.stock || p.status || "In Stock";

    let badgeClass = "in";

    if(stock === "Coming Soon")
      badgeClass = "coming";

    if(stock === "Out of Stock")
      badgeClass = "out";


    const div =
      document.createElement("div");

    div.className = "product";

    div.innerHTML = `

      <div class="product-top">

        <img
          class="product-img"
          src="${escapeAttr(p.image || "")}"
          onerror="this.src='538820.jpg';">

        <div class="product-info">

          <h3>
            ${escapeHTML(p.name || "Unnamed Product")}
          </h3>

          <p>
            <b>Code:</b>
            ${escapeHTML(p.code || p.id)}
          </p>

          <p>
            <b>Category:</b>
            ${escapeHTML(p.category || "-")}
          </p>

          <p>
            <b>MOQ:</b>
            ${escapeHTML(
              p.moq ||
              "₹500 Minimum Order Quantity (MOQ)"
            )}
          </p>

          <span class="badge ${badgeClass}">
            ${escapeHTML(stock)}
          </span>

        </div>

      </div>

      <div class="actions">

        <button
          class="edit"
          onclick="openEdit('${escapeAttr(p.id)}')">
          EDIT
        </button>

        <button
          class="delete"
          onclick="deleteProduct('${escapeAttr(p.id)}')">
          DELETE
        </button>

      </div>

    `;

    list.appendChild(div);

  });

}


/* ================================
   STATS
================================ */

function updateStats(){

  let inStock = 0;
  let coming = 0;
  let out = 0;

  products.forEach(function(p){

    const stock =
      p.stock || p.status || "In Stock";

    if(stock === "In Stock")
      inStock++;

    if(stock === "Coming Soon")
      coming++;

    if(stock === "Out of Stock")
      out++;

  });

  document.getElementById("totalCount")
    .textContent = products.length;

  document.getElementById("inStockCount")
    .textContent = inStock;

  document.getElementById("comingCount")
    .textContent = coming;

  document.getElementById("outCount")
    .textContent = out;

}


/* ================================
   ADD
================================ */

function openAdd(){

  isAdding = true;
  editingId = null;

  document.getElementById("modalTitle")
    .textContent = "Add New Product";

  document.getElementById("pCode").value = "";
  document.getElementById("pName").value = "";
  document.getElementById("pCategory").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pStock").value = "In Stock";

  document.getElementById("pMOQ").value =
    "₹500 Minimum Order Quantity (MOQ)";

  document.getElementById("imagePreview").style.display =
    "none";

  document.getElementById("saveMessage").textContent = "";

  document.getElementById("modal").style.display =
    "block";

}


/* ================================
   EDIT
================================ */

function openEdit(id){

  const p =
    products.find(function(x){
      return x.id === id;
    });

  if(!p) return;

  isAdding = false;
  editingId = id;

  document.getElementById("modalTitle")
    .textContent = "Edit Product";

  document.getElementById("pCode").value =
    p.code || id;

  document.getElementById("pName").value =
    p.name || "";

  document.getElementById("pCategory").value =
    p.category || "";

  document.getElementById("pImage").value =
    p.image || "";

  document.getElementById("pStock").value =
    p.stock || p.status || "In Stock";

  document.getElementById("pMOQ").value =
    p.moq ||
    "₹500 Minimum Order Quantity (MOQ)";

  document.getElementById("saveMessage").textContent = "";

  previewImage();

  document.getElementById("modal").style.display =
    "block";

}


/* ================================
   SAVE
================================ */

function saveProduct(){

  const code =
    document.getElementById("pCode")
      .value.trim();

  const name =
    document.getElementById("pName")
      .value.trim();

  const category =
    document.getElementById("pCategory")
      .value.trim();

  const image =
    document.getElementById("pImage")
      .value.trim();

  const stock =
    document.getElementById("pStock").value;

  const moq =
    document.getElementById("pMOQ")
      .value.trim();


  if(!code || !name){

    document.getElementById("saveMessage").innerHTML =
      '<div class="error">Product Code અને Product Name જરૂરી છે.</div>';

    return;
  }


  const data = {

    code: code,

    name: name,

    category: category,

    image: image,

    stock: stock,

    status: stock,

    moq:
      moq ||
      "₹500 Minimum Order Quantity (MOQ)",

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };


  document.getElementById("saveMessage").innerHTML =
    '<div class="success">Saving...</div>';


  let operation;


  if(isAdding){

    operation =
      db.collection("products")
        .doc(code)
        .set(data);

  }else{

    operation =
      db.collection("products")
        .doc(editingId)
        .update(data);

  }


  operation
  .then(function(){

    document.getElementById("saveMessage").innerHTML =
      '<div class="success">✓ Product saved successfully.</div>';

    setTimeout(function(){
      closeModal();
    },700);

  })
  .catch(function(error){

    document.getElementById("saveMessage").innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

  });

}


/* ================================
   DELETE
================================ */

function deleteProduct(id){

  const p =
    products.find(function(x){
      return x.id === id;
    });

  if(!p) return;


  if(/^OSS_\d+$/i.test(p.code || id)){

    alert(
      "OSS master products cannot be deleted."
    );

    return;
  }


  const ok =
    confirm(
      "Delete this product permanently?"
    );

  if(!ok) return;


  db.collection("products")
    .doc(id)
    .delete()
    .then(function(){

      alert("Product deleted.");

    })
    .catch(function(error){

      alert(error.message);

    });

}


/* ================================
   IMAGE PREVIEW
================================ */

function previewImage(){

  const url =
    document.getElementById("pImage")
      .value.trim();

  const img =
    document.getElementById("imagePreview");

  if(!url){

    img.style.display = "none";
    return;
  }

  img.src = url;
  img.style.display = "block";

}


/* ================================
   CLOSE
================================ */

function closeModal(){

  document.getElementById("modal")
    .style.display = "none";

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


/* ================================
   MODAL CLICK OUTSIDE
================================ */

window.onclick = function(event){

  const modal =
    document.getElementById("modal");

  if(event.target === modal){
    closeModal();
  }

};

</script>

</body>
</html>
