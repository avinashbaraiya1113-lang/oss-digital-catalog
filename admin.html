<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSS Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

header{
  background:#101c3a;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
}

header img{
  width:55px;
  height:55px;
  object-fit:contain;
  border-radius:50%;
  background:white;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:4px 0 0;
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.login{
  max-width:420px;
  margin:60px auto;
}

h2{
  color:#101c3a;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,
select,
button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccd3dd;
  font-size:15px;
}

input,
select{
  margin-bottom:14px;
}

button{
  border:0;
  background:#101c3a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  word-break:break-word;
}

.error{
  background:#ffebee;
  color:#b71c1c;
}

.success{
  background:#e8f5e9;
  color:#1b5e20;
}

.logout{
  width:auto;
  background:#c62828;
  padding:10px 18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.product-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:210px;
  object-fit:contain;
  background:#f7f7f7;
}

.product-body{
  padding:14px;
}

.code{
  font-size:13px;
  color:#687385;
  font-weight:bold;
}

.name{
  font-size:16px;
  font-weight:bold;
  margin:6px 0;
}

.category{
  font-size:13px;
  color:#566171;
  margin-bottom:8px;
}

.in{
  color:#188038;
  font-weight:bold;
}

.coming{
  color:#f29900;
  font-weight:bold;
}

.out{
  color:#d93025;
  font-weight:bold;
}

.edit{
  margin-top:10px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:17px;
  }

}
</style>
</head>

<body>

<header>

<img src="538820.jpg" alt="OSS">

<div>
<h1>ONE STOP SOLUTION (OSS)</h1>
<p>EVERY PROBLEM ONE SOLUTION — ADMIN PANEL</p>
</div>

</header>


<!-- LOGIN -->

<section id="loginSection" class="container">

<div class="card login">

<h2>Admin Login</h2>

<label>Email</label>

<input
  type="email"
  id="email"
  placeholder="Enter admin email"
>

<label>Password</label>

<input
  type="password"
  id="password"
  placeholder="Enter password"
>

<button id="loginBtn">
Login
</button>

<div id="loginMessage" class="message"></div>

</div>

</section>


<!-- ADMIN -->

<section id="adminSection" class="container hidden">


<div class="card">

<div class="top">

<div>
<h2>OSS Product Management</h2>
<p>37 Master Products</p>
</div>

<button
  id="logoutBtn"
  class="logout"
>
Logout
</button>

</div>

<div id="adminMessage" class="message"></div>

</div>


<!-- EDIT -->

<div class="card">

<h2>Edit Stock</h2>

<label>Select Product</label>

<select id="productSelect">

<option value="">
Select Product
</option>

</select>


<label>Product Code</label>

<input id="editCode" readonly>


<label>Product Name</label>

<input id="editName" readonly>


<label>Category</label>

<input id="editCategory" readonly>


<label>Image</label>

<input id="editImage" readonly>


<label>Stock Status</label>

<select id="editStock">

<option value="In Stock">
In Stock
</option>

<option value="Coming Soon">
Coming Soon
</option>

<option value="Out of Stock">
Out of Stock
</option>

</select>


<button id="saveBtn">
Save Stock Status
</button>

<div id="saveMessage" class="message"></div>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>
All Products
<span id="productCount"></span>
</h2>

<div
  id="loading"
  style="padding:15px"
>
Loading...
</div>

<div
  id="products"
  class="product-list"
></div>

</div>

</section>



<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDocs,
  setDoc,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyBY7FpGggnMnv-IsqG81rjY1ofCWRm48wk",

authDomain:
"oss-digital-catalog.firebaseapp.com",

projectId:
"oss-digital-catalog",

storageBucket:
"oss-digital-catalog.firebasestorage.app",

messagingSenderId:
"294933773409",

appId:
"1:294933773409:web:3a62fc14daaa9d344cfe20",

measurementId:
"G-GT8YNKQJ5K"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN UID */

const ADMIN_UID =
"NBaVvM86X9SqffFiWI7lA27Isnl1";


/* MASTER PRODUCTS */

const PRODUCTS = [

["OSS_001","Bathroom Accessories","DOUBLE GRID SOAP BOX","OSS_001.jpg"],

["OSS_002","Home & Kitchen","MINI POPCORN MAKER","OSS_002.jpg"],

["OSS_003","Water Bottle","2L MOTIVATIONAL WATTER BOTTLE","OSS_003.jpg"],

["OSS_004","Home & Kitchen","5M OUTDOOR CLOTHESLINE","OSS_004.jpg"],

["OSS_005","Home & Kitchen","10M OUTDOOR CLOTHESLINE","OSS_005.jpg"],

["OSS_006","Toys","48PCS CAR CONTAINER","OSS_006.jpg"],

["OSS_007","Water Bottle","3PCS MOTIVATION WATER BOTTLE","OSS_007.jpg"],

["OSS_008","Water Bottle","HOT AND COLD DORI BOTTLE","OSS_008.webp"],

["OSS_009","Water Bottle","1000ML STEEL WATER BOTTLE","OSS_009.jpg"],

["OSS_010","Home & Kitchen","VACCUM FLASK SET WITH 3 CUPS","OSS_010.jpg"],

["OSS_011","Electric & Smart Gadgets","PLUG MOSQUITO KILLER LAMP","OSS_011.webp"],

["OSS_012","Electric & Smart Gadgets","ELECTRIC GAS LIGHTER","OSS_012.jpg"],

["OSS_013","Car Accessories","PORTABLE CAR AIR MATTRESS","OSS_013.webp"],

["OSS_014","Electric & Smart Gadgets","SOLAR RECHARGEABLE LED FLOOD LIGHT","OSS_014.jpg"],

["OSS_015","Tools And Hardware","ANTI SLIP TAPE WITH GLOW IN DARK STRIPE","OSS_015.jpg"],

["OSS_016","Folding Furniture","PORTABLE INFLATABLE BED","OSS_016.webp"],

["OSS_017","Car Accessories","4PCS MAGNETIC CAR WINDOW CURTAIN","OSS_017.jpg"],

["OSS_018","Home & Kitchen","CLOTH DRYING ROPE WITH 12 CLIPS","OSS_018.jpg"],

["OSS_019","Health & Personal Care","PORTABLE MESH NEBULIZER MACHINE","OSS_019.jpg"],

["OSS_020","Smart Stationery","30PCS SELF ADHESIVE TRANSPARENT BOOK COVER","OSS_020.webp"],

["OSS_021","Gifts & Decor","7 INCH MOVING SAND ART","OSS_021.jpg"],

["OSS_022","Smart Gadgets","ALL IN ONE 60W USB FAST CHARGING TRAVEL DATA CABLE SET","OSS_022.webp"],

["OSS_023","Folding Furniture","PORTABLE FOLDING CHAIR","OSS_023.jpg"],

["OSS_024","Multipurpose Cleaning Tool","SLIM FLOOR WIPER MOP WITH SILICONE BLADE & TELESCOPIC HANDLE","OSS_024.webp"],

["OSS_025","Smart Gadgets","ANTI VIBRATION PADS","OSS_025.jpg"],

["OSS_026","Toys","DANCING JELLYFISH TOY WITH MUSIC & MOVEMENT","OSS_026.jpg"],

["OSS_027","Mobile Accessories","360°METAL DESKTOP MOBILE PHONE STAND","OSS_027.jpg"],

["OSS_028","Health & Personal Care","ELECTRIC WATER HOT BAG","OSS_028.jpg"],

["OSS_029","Folding Furniture","2.5×6 NON ADJUSTABLE FOLDING BED","OSS_029.jpg"],

["OSS_030","Folding Furniture","2.5×6 ADJUSTABLE FOLDING BED","OSS_030.jpg"],

["OSS_031","Water Bottle","HOT & COLD 1000ML STEEL WATER BOTTLE","OSS_031.jpg"],

["OSS_032","Car Accessories","2PCS HD VISION DRIVING GLASSES","OSS_032.jpg"],

["OSS_033","Travel Accessories","PORTABLE 2 IN 1 CAMPING GAS STOVE","OSS_033.jpg"],

["OSS_034","Gifts & Decor","ELECTRIC KAPOOR DANI WITH NIGHT LAMP","OSS_034.jpg"],

["OSS_035","Home & Kitchen","WATER-ABSORBING RUBBER DOORMAT","OSS_035.jpg"],

["OSS_036","Smart Stationery","MAGIC PRACTICE COPYBOOK","OSS_036.jpg"],

["OSS_037","Multipurpose Cleaning Cloth","40×40 MICROFIBER CLOTH (ONLY YELLOW)","OSS_037.jpg"]

];


const loginSection =
document.getElementById("loginSection");

const adminSection =
document.getElementById("adminSection");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const productSelect =
document.getElementById("productSelect");

const editCode =
document.getElementById("editCode");

const editName =
document.getElementById("editName");

const editCategory =
document.getElementById("editCategory");

const editImage =
document.getElementById("editImage");

const editStock =
document.getElementById("editStock");

const saveBtn =
document.getElementById("saveBtn");

const saveMessage =
document.getElementById("saveMessage");

const productsDiv =
document.getElementById("products");

const loading =
document.getElementById("loading");

const productCount =
document.getElementById("productCount");


function message(
element,
text,
type="error"
){

element.textContent =
text;

element.className =
"message " + type;

element.style.display =
"block";

}


/* LOGIN */

loginBtn.addEventListener(
"click",
async()=>{

const mail =
email.value.trim();

const pass =
password.value;

if(!mail || !pass){

message(
loginMessage,
"Email અને Password બંને નાખો."
);

return;

}

loginBtn.disabled =
true;

loginBtn.textContent =
"Logging in...";

try{

const result =
await signInWithEmailAndPassword(
auth,
mail,
pass
);

if(
result.user.uid !== ADMIN_UID
){

await signOut(auth);

message(
loginMessage,
"આ account ને Admin access નથી."
);

return;

}

message(
loginMessage,
"Login successful.",
"success"
);

}
catch(error){

console.error(error);

let text =
"Login Error: " +
(error.message || error.code);

if(
error.code ===
"auth/invalid-credential"
){

text =
"Email અથવા Password ખોટો છે.";

}

message(
loginMessage,
text
);

}

finally{

loginBtn.disabled =
false;

loginBtn.textContent =
"Login";

}

});


/* LOGOUT */

logoutBtn.addEventListener(
"click",
()=>signOut(auth)
);


/* PRODUCT SELECT */

function createProductOptions(){

productSelect.innerHTML =
`<option value="">Select Product</option>`;

PRODUCTS.forEach(
p=>{

const option =
document.createElement("option");

option.value =
p[0];

option.textContent =
p[0] +
" — " +
p[2];

productSelect.appendChild(
option
);

});

}


/* SELECT */

productSelect.addEventListener(
"change",
async()=>{

const code =
productSelect.value;

const product =
PRODUCTS.find(
p=>p[0]===code
);

if(!product){

editCode.value="";
editName.value="";
editCategory.value="";
editImage.value="";

return;

}

editCode.value =
product[0];

editCategory.value =
product[1];

editName.value =
product[2];

editImage.value =
product[3];

try{

const snap =
await getDocs(
collection(
db,
"products"
)
);

snap.forEach(
item=>{

if(item.id===code){

const data =
item.data();

editStock.value =
data.stock ||
"In Stock";

}

});

}
catch(error){

console.error(error);

}

});


/* INITIALIZE */

async function initializeProducts(){

try{

const snap =
await getDocs(
collection(
db,
"products"
)
);

const old = {};

snap.forEach(
item=>{
old[item.id] =
item.data();
});


for(
const p of PRODUCTS
){

await setDoc(

doc(
db,
"products",
p[0]
),

{

code:p[0],

category:p[1],

name:p[2],

image:p[3],

moq:
"₹500 Minimum Order Quantity (MOQ)",

stock:
old[p[0]]?.stock ||
"In Stock",

status:
old[p[0]]?.stock ||
"In Stock"

},

{
merge:true
}

);

}

}
catch(error){

console.error(error);

message(
document.getElementById("adminMessage"),
"Firestore Error: " +
error.message
);

}

}


/* SAVE */

saveBtn.addEventListener(
"click",
async()=>{

const code =
editCode.value;

if(!code){

message(
saveMessage,
"પહેલા Product પસંદ કરો."
);

return;

}

const product =
PRODUCTS.find(
p=>p[0]===code
);

if(!product){

return;

}

const stock =
editStock.value;

saveBtn.disabled =
true;

saveBtn.textContent =
"Saving...";

try{

await setDoc(

doc(
db,
"products",
code
),

{

code:product[0],

category:product[1],

name:product[2],

image:product[3],

moq:
"₹500 Minimum Order Quantity (MOQ)",

stock:stock,

status:stock

},

{
merge:true
}

);

message(
saveMessage,
"Stock status updated successfully.",
"success"
);

}
catch(error){

message(
saveMessage,
"Save Error: " +
error.message
);

}

finally{

saveBtn.disabled =
false;

saveBtn.textContent =
"Save Stock Status";

}

});


/* RENDER */

function renderProducts(list){

productsDiv.innerHTML =
"";

PRODUCTS.forEach(
master=>{

const data =
list.find(
p=>p.code===master[0]
) || {};

const stock =
data.stock ||
"In Stock";

let cls =
"in";

if(
stock==="Coming Soon"
) cls="coming";

if(
stock==="Out of Stock"
) cls="out";


const div =
document.createElement("div");

div.className =
"product";

div.innerHTML = `

<img
src="${master[3]}"
alt="${master[2]}"
>

<div class="product-body">

<div class="code">
${master[0]}
</div>

<div class="name">
${master[2]}
</div>

<div class="category">
${master[1]}
</div>

<div class="${cls}">
● ${stock}
</div>

<button
class="edit"
data-code="${master[0]}"
>
Edit Stock
</button>

</div>
`;

productsDiv.appendChild(div);

});


document
.querySelectorAll(".edit")
.forEach(
btn=>{

btn.addEventListener(
"click",
()=>{

productSelect.value =
btn.dataset.code;

productSelect.dispatchEvent(
new Event("change")
);

window.scrollTo({
top:0,
behavior:"smooth"
});

});

});


productCount.textContent =
" — " +
PRODUCTS.length;

}


/* FIRESTORE LISTENER */

function startListener(){

onSnapshot(

collection(
db,
"products"
),

snap=>{

const list=[];

snap.forEach(
item=>{

list.push({
...item.data(),
code:item.id
});

});

renderProducts(list);

loading.style.display =
"none";

},

error=>{

console.error(error);

loading.textContent =
"Firestore Error: " +
error.message;

});

}


/* AUTH */

onAuthStateChanged(
auth,
async user=>{

if(!user){

loginSection.classList.remove(
"hidden"
);

adminSection.classList.add(
"hidden"
);

return;

}


if(
user.uid !== ADMIN_UID
){

await signOut(auth);

return;

}


loginSection.classList.add(
"hidden"
);

adminSection.classList.remove(
"hidden"
);

createProductOptions();

await initializeProducts();

startListener();

});

</script>

</body>
  </html>
