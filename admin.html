/* =========================================================

========================================================= */

const loginSection =

const adminSection =

/* =========================================================

========================================================= */

const code =
  document.querySelector("#code");

const name =
  document.querySelector("#name");

const category =
  document.querySelector("#category");

const image =

const stock =

const moq =

const previewImage =

/* =========================================================
   LOCAL DATA
========================================================= */

let allProducts = [];

let currentProductId = "";



/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
  "click",
  async () => {

    loginMessage.innerHTML = "";

    const userEmail =
      email.value.trim();

    const userPassword =
      password.value;


    if(
      !userEmail ||
      !userPassword
    ){

      loginMessage.innerHTML =
        `<div class="message error">
          Email and password required.
        </div>`;

      return;

    }


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "Logging in...";


    try{

      await signInWithEmailAndPassword(
        auth,
        userEmail,
        userPassword
      );

    }
    catch(error){

      console.error(error);

      loginMessage.innerHTML =
        `<div class="message error">
          Login failed: ${error.message}
        </div>`;

    }
    finally{

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "Login";

    }

  }
);



/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  () => {

    signOut(auth);

  }
);



/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(
      user &&
      user.uid === ADMIN_UID
    ){

      loginSection.classList.add(
        "hidden"
      );

      adminSection.classList.remove(
        "hidden"
      );

      await initializeProducts();

      listenProducts();

    }

    else{

      loginSection.classList.remove(
        "hidden"
      );

      adminSection.classList.add(
        "hidden"
      );

    }

  }
);



/* =========================================================
   INITIALIZE MASTER PRODUCTS
========================================================= */

async function initializeProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    const existing =
      new Map();


    snapshot.forEach(
      item => {

        existing.set(
          item.id,
          item.data()
        );

      }
    );


    for(
      const p of MASTER_PRODUCTS
    ){

      const [
        pCode,
        pName,
        pCategory,
        pImage
      ] = p;


      if(
        !existing.has(pCode)
      ){

        await setDoc(
          doc(
            db,
            "products",
            pCode
          ),
          {

            code:pCode,

            name:pName,

            category:pCategory,

            image:pImage,

            stock:"In Stock",

            status:"In Stock",

            moq:DEFAULT_MOQ

          }
        );

      }

    }

  }
  catch(error){

    console.error(
      "Initialization error:",
      error
    );

  }

}



/* =========================================================
   FIRESTORE LIVE LISTENER
========================================================= */

function listenProducts(){

  onSnapshot(

    collection(
      db,
      "products"
    ),

    snapshot => {

      allProducts = [];


      snapshot.forEach(
        item => {

          const data =
            item.data();


          allProducts.push({

            id:item.id,

            code:
              data.code ||
              item.id,

            name:
              data.name ||
              "",

            category:
              data.category ||
              "",

            image:
              data.image ||
              "",

            stock:
              data.stock ||
              data.status ||
              "In Stock",

            status:
              data.status ||
              data.stock ||
              "In Stock",

            moq:
              data.moq ||
              DEFAULT_MOQ

          });

        }
      );


      renderSelect();

      renderAllProducts();

      productCount.textContent =
        `${allProducts.length} Products`;

    },

    error => {

      console.error(
        "Firestore error:",
        error
      );

    }

  );

}



/* =========================================================
   PRODUCT SELECT
========================================================= */

function renderSelect(){

  const oldValue =
    currentProductId;


  productSelect.innerHTML =
    allProducts
      .map(
        p => `

          <option
            value="${escapeHtml(p.id)}"
          >
            ${escapeHtml(p.code)}
            —
            ${escapeHtml(p.name)}
          </option>

        `
      )
      .join("");


  if(
    oldValue &&
    allProducts.some(
      p =>
        p.id === oldValue
    )
  ){

    productSelect.value =
      oldValue;

  }


  if(
    !productSelect.value &&
    allProducts.length
  ){

    productSelect.value =
      allProducts[0].id;

  }


  loadSelectedProduct();

}



/* =========================================================
   SELECT CHANGE
========================================================= */

productSelect.addEventListener(
  "change",
  loadSelectedProduct
);



/* =========================================================
   LOAD SELECTED PRODUCT
========================================================= */

function loadSelectedProduct(){

  const id =
    productSelect.value;


  const product =
    allProducts.find(
      p =>
        p.id === id
    );


  if(!product) return;


  currentProductId =
    product.id;


  code.value =
    product.code;

  name.value =
    product.name;

  category.value =
    product.category;

  image.value =
    product.image;

  stock.value =
    product.stock;

  moq.value =
    product.moq;


  updatePreview();

  saveMessage.innerHTML =
    "";

}
